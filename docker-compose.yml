# Raumplaner – no clone needed: just download this file and run
#   docker compose up -d
# Update:  docker compose pull && docker compose up -d
# Logs:    docker compose logs -f
services:
  roomplanner:
    image: ghcr.io/jami100yt/roomplanner:latest   # or pin a version, e.g. :2.0.0
    container_name: roomplanner
    restart: unless-stopped
    ports:
      - "3000:3000"            # only reachable locally? → "127.0.0.1:3000:3000"
    volumes:
      - roomplanner-data:/app/data   # plans + secret.key – survive updates
    stop_grace_period: 10s     # time to save on shutdown

volumes:
  roomplanner-data:
